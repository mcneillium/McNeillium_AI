url: http://localhost:8765/demos/aac-app/
out: explainers/footage/voice-start.mp4
viewport: [430, 932]
scale: 2
mobile: true
color_scheme: light
steps:
  - wait: 1800
  - mark: welcome
  - tap: '[aria-label^="Adult. Calm"]'
  - tap: {selector: '[aria-label="Start talking"]', after: 1200}
  - mark: board
  - tap: {selector: '[aria-label="Say I want. starter"]', after: 1400}
  - mark: suggestions
  - eval: "window.__sugg=[...document.querySelectorAll('[aria-label^=\"Suggestion:\"]')].map(e=>e.getAttribute('aria-label'))"
  - tap: {selector: '[aria-label="Say more. adjective"]', after: 1200}
  - tap: {selector: '[aria-label^="Speak"]', after: 1800}
  - mark: spoken
