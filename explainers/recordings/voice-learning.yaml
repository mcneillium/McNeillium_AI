url: http://localhost:8765/demos/aac-app/
out: explainers/footage/voice-learning.mp4
viewport: [430, 932]
scale: 2
mobile: true
color_scheme: light
steps:
  - tap: '[aria-label^="Adult. Calm"]'
  - tap: {selector: '[aria-label="Start talking"]', after: 500}
  - tap: {selector: '[aria-label="Personalise tab"]', after: 900}
  - mark: personalise
  - eval: "[...document.querySelectorAll('div')].find(e=>e.textContent==='Learn from my messages').scrollIntoView({behavior:'smooth',block:'center'})"
  - wait: 1300
  - mark: switch
  - tap: {selector: 'xpath=//*[text()="Learn from my messages"]/following::*[@role="switch"][1]', after: 1800}
  - mark: switched
  - tap: {selector: '[aria-label="Talk tab"]', after: 700}
  - mark: teach
  - tap: {selector: '[aria-label="Say I want. starter"]', after: 350}
  - tap: {selector: '[aria-label="Go to People page"]', after: 450}
  - tap: {selector: '[aria-label="Say dad. noun"]', after: 350}
  - tap: {selector: '[aria-label^="Speak"]', after: 1700}
  - tap: {selector: '[aria-label="Clear"]', after: 350}
  - tap: {selector: '[aria-label="Go to home page"]', after: 400}
  - tap: {selector: '[aria-label="Say I want. starter"]', after: 350}
  - tap: {selector: '[aria-label="Go to People page"]', after: 450}
  - tap: {selector: '[aria-label="Say dad. noun"]', after: 350}
  - tap: {selector: '[aria-label^="Speak"]', after: 1700}
  - tap: {selector: '[aria-label="Clear"]', after: 350}
  - tap: {selector: '[aria-label="Go to home page"]', after: 400}
  - tap: {selector: '[aria-label="Say I want. starter"]', after: 350}
  - tap: {selector: '[aria-label="Go to People page"]', after: 450}
  - tap: {selector: '[aria-label="Say dad. noun"]', after: 350}
  - tap: {selector: '[aria-label^="Speak"]', after: 1700}
  - tap: {selector: '[aria-label="Clear"]', after: 350}
  - tap: {selector: '[aria-label="Go to home page"]', after: 500}
  - mark: taught
  - tap: {selector: '[aria-label="Say I want. starter"]', after: 2400}
  - mark: suggested
  - tap: {selector: '[aria-label="Me tab"]', after: 800}
  - eval: "document.querySelector('[aria-label=\"See what Voice has learned\"]').scrollIntoView({behavior:'smooth',block:'center'})"
  - wait: 1000
  - tap: {selector: '[aria-label="See what Voice has learned"]', after: 2400, js: true}
  - mark: learned
