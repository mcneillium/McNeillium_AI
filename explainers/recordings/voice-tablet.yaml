url: http://localhost:8765/demos/aac-app/
out: explainers/footage/voice-tablet.mp4
viewport: [600, 900]
scale: 1.5
mobile: true
ripples: false
color_scheme: light
steps:
  - tap: '[aria-label^="Adult. Calm"]'
  - tap: {selector: '[aria-label="Start talking"]', after: 900}
  - mark: start
  - tap: {selector: '[aria-label="Say I need. starter"]', after: 1300}
  - tap: {selector: '[aria-label="Say help. verb"]', after: 1300}
  - tap: {selector: '[aria-label^="Speak"]', after: 2200}
  - tap: {selector: '[aria-label="Clear"]', after: 900}
  - tap: {selector: '[aria-label="Say I want. starter"]', after: 1300}
  - tap: {selector: '[aria-label="Say go. verb"]', after: 1300}
  - tap: {selector: '[aria-label^="Speak"]', after: 2200}
