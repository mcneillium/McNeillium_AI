title: "Six rules for machine learning research you can check"
kicker: "Explainer · Research method"
subtitle: "How two reproducible studies were run, and the mistakes they caught"
end_title: "See the rules in practice"
end_text: "Both studies, their corrections and their logs: paulmartinmcneill.com/research"
youtube:
  title: "Six rules for reproducible machine learning research (with real corrections)"
  tags: [reproducible research, machine learning, data leakage, baselines, research methods]
  summary: 'The rules behind two reproducible machine learning studies: protocol first, baselines first, fingerprinted splits, nothing learned from held-out data, negative results reported, and a public log of every decision, including two mistakes that were caught and corrected.'
  links:
  - - Both studies and their corrections
    - https://paulmartinmcneill.com/research/
  - - River study code
    - https://github.com/mcneillium/river-early-warning
  - - Drug study code
    - https://github.com/mcneillium/drug-response-beyond-marker
  note: Neither study has been peer reviewed.
  thumbnail:
    kicker: Method
    text: 6 rules for ML you can *check*
