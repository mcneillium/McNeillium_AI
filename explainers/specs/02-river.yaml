  title: "Can river floods be forecast without tomorrow's weather? 671 UK catchments tested"
  tags: [hydrology, flood forecasting, machine learning, CAMELS-GB, LSTM, gradient boosting, reproducible research]
  summary: 'How far ahead can river flow and flood warnings be forecast without knowing future weather? A reproducible test across 671 British catchments (CAMELS-GB, 1970 to 2022): the score at seven days, what an unseen region and a drier climate cost, whether an LSTM beats gradient boosting, and how many warnings are false alarms.'
  links:
  - - Full study, charts and limits
