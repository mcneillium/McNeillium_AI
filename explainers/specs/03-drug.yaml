youtube:
  title: "Drug response beyond a single marker: what 924 cancer cell lines show"
  tags: [bioinformatics, machine learning, GDSC, PTEN, feature selection, data leakage, reproducible research]
  summary: One gene, PTEN, is a known but incomplete guide to how cancer cell lines respond to AKT inhibitors. Using 924 cell lines from the public GDSC screen, this study measures how much more wider molecular data explains, how a common feature-selection mistake invents skill, and how stable the explanations are.
