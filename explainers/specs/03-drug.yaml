segments:
  - text: >-
      One gene, PTEN, is a known but incomplete guide to how cancer cells respond to
      drugs that block a protein called AKT. This study asks how much more wider
      molecular data can explain, using 924 cancer cell lines from the public GDSC
      screen.
    shots:
      - url: https://paulmartinmcneill.com/research/
        focus: "#drug-response h2"
        zoom: 1.6
  - text: >-
      PTEN alone explains about 5 per cent of the variation in response. Adding cancer
      type and sequencing centre takes that to 11 per cent. Adding two thousand genes
      reaches 14 per cent with an elastic net, and 19 per cent with gradient boosting.
    shots:
      - image: explainers/assets/drug-ladder.jpg
      - url: https://paulmartinmcneill.com/research/
        focus: "#drug-response .research__table"
        zoom: 1.5
  - text: >-
      So more than four fifths of the response stays unexplained. And that gap is not
      mainly measurement noise. A related drug was measured twice: about 80 per cent of
      its variation repeats, yet the best model for it explains only 18 per cent.
    shots:
      - card:
          kicker: "The gap"
          title: "Repeats agree on about 80%. The best model explains 18%."
          sub: "Exploratory. Both figures are for a related drug, Uprosertib, measured twice at the same doses."
          size: 84
  - text: >-
      The study also measures a common mistake. Choosing genes by their link to the
      response before cross-validating produces a score of 0.14 even on shuffled data,
      where there is nothing to find. Choosing inside each fold removes the leak.
    shots:
      - image: explainers/assets/drug-leak.jpg
  - text: >-
      The explanations were not stable either. The top twenty genes of refitted models
      overlap by only 0.2, and no stable subgroups were found beyond tissue of origin.
    shots:
      - image: explainers/assets/drug-clusters.jpg
  - text: >-
      Cell lines are a stand-in: nothing here is about patients or treatment. The
      study has not been peer reviewed. The code, protocol and decision log are public.
    shots:
      - url: https://paulmartinmcneill.com/research/
        focus: "#drug-response .research__links"
        zoom: 1.6
